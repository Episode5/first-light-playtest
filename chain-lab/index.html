<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>First Light — Progressive world</title>
<style>
:root{font:15px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#edf7f2;background:#061416;--ink:#061416;--panel:#0c2225;--panel2:#102b2d;--line:#244347;--soft:#8eaaa5;--mint:#b7f3cf;--mint2:#72cfa2;--gold:#ead7a4;--danger:#e9abab}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#061416}body{display:flex;justify-content:center}button,input{font:inherit}button{appearance:none;border:0;color:inherit;background:none}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}.phone{width:100%;max-width:430px;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 42px);background:linear-gradient(180deg,#0a2023 0,#061416 34rem);overflow-x:hidden}
.top{padding:2px 2px 12px}.topline{display:flex;align-items:end;justify-content:space-between;gap:12px}.wordmark{display:block;font-size:.72rem;letter-spacing:.19em;font-weight:800;color:var(--mint)}#phase{font-size:1.45rem;line-height:1.05;font-weight:700;letter-spacing:-.03em;margin-top:5px}.count{font-variant-numeric:tabular-nums;color:#cfe2dc;font-weight:650}.track{height:3px;background:#153336;border-radius:99px;margin-top:12px;overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--mint2);transition:width .5s ease}
.mixer{position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:10;background:#0a2225ee;backdrop-filter:blur(18px);border:1px solid #315359;border-radius:19px;padding:10px;box-shadow:0 12px 28px #0008}.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:stretch}.slot{min-height:54px;border-radius:13px;background:#07191b;border:1px solid #25464a;padding:8px;text-align:left}.slot span{display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.11em;color:#6f918c}.slot strong{display:block;margin-top:4px;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plus{display:grid;place-items:center;color:#668984;font-weight:700}.mixer-actions{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:8px}.combine{min-height:42px;border-radius:12px;background:var(--mint);color:#08231f;font-weight:800}.combine:disabled{background:#1a3938;color:#668884}.clear{width:42px;height:42px;border-radius:12px;background:#132f31;color:#a9c0bb;font-size:1.1rem}.status{margin:8px 2px 0;min-height:18px;font-size:.78rem;color:#a9c0bb}.branchbar{margin:9px 0 0;padding:9px 10px;border-radius:12px;background:#2d3325;border:1px solid #665f3d;display:flex;align-items:center;justify-content:space-between;gap:9px}.branchbar[hidden]{display:none}.branchbar strong{color:var(--gold);font-size:.82rem}.branchbar button{font-size:.78rem;color:#f3e8c4;text-decoration:underline;text-underline-offset:3px}
.reveal{margin:11px 0 0;padding:12px;border:1px solid #42715c;border-radius:15px;background:#113529;animation:rise .28s ease}.reveal[hidden]{display:none}.reveal small{display:block;color:#8eb7a4;text-transform:uppercase;letter-spacing:.1em}.reveal strong{display:block;font-size:1.18rem;color:#d8ffe3;margin-top:2px}.reveal .new-meta{color:#aac7bc;font-size:.8rem;margin-top:3px}.reveal button{margin-top:9px;color:var(--mint);font-weight:700;font-size:.82rem}
section.layer{padding:20px 1px 0}.layer-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}.layer h2{font-size:1rem;margin:0;letter-spacing:-.01em}.subtle{font-size:.76rem;color:#819d98;margin:2px 0 0}.search{border:1px solid #29494c;background:#081b1e;color:#edf8f2;border-radius:12px;padding:10px 11px;width:100%;margin:0 0 10px}.search[hidden]{display:none}.tabs{display:flex;gap:6px;overflow:auto;padding:0 0 9px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid #28484b;border-radius:999px;padding:7px 10px;color:#9eb6b1;font-size:.78rem}.tab[aria-pressed=true]{background:#1c433b;border-color:#5a8e76;color:#e4fff0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.concept{min-height:54px;text-align:left;border:1px solid #254347;background:#0b2225;border-radius:14px;padding:9px 10px;transition:transform .08s ease,border-color .15s ease,background .15s ease}.concept:active{transform:scale(.985)}.concept[aria-pressed=true]{border-color:#96d7b2;background:#1d4338}.concept b{display:block;font-size:.92rem}.concept small{display:block;color:#7e9c96;font-size:.69rem;margin-top:2px}.empty{color:#78948f;border:1px dashed #274447;border-radius:14px;padding:13px;font-size:.82rem}
#memory[hidden],#pattern[hidden],#structures[hidden]{display:none}.memory-list{display:flex;flex-direction:column;gap:6px}.memory-row{display:flex;align-items:center;gap:7px;padding:8px 2px;border-bottom:1px solid #173438;font-size:.82rem}.memory-row:last-child{border-bottom:0}.memory-row .arrow{color:#628d80}.memory-row .result{color:var(--mint);font-weight:700}.memory-more{color:#7fa39a;font-size:.76rem;margin-top:7px}
.pattern{border:1px solid #625f45;background:linear-gradient(145deg,#24281e,#141f1e);border-radius:17px;padding:13px;animation:rise .3s ease}.pattern-eyebrow{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold)}.path{margin:8px 0;font-size:.88rem;line-height:1.7}.junction{display:inline-block;background:#473f25;color:#f8e4aa;border-radius:999px;padding:1px 7px;font-weight:750}.primary{width:100%;border-radius:12px;background:var(--mint);color:#08231f;font-weight:800;padding:10px}.structure{border:1px solid #2b4e4e;background:#0a2023;border-radius:17px;padding:12px;margin-bottom:8px}.structure-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:#759a91}.structure-flow{font-size:.86rem;margin:6px 0 10px;color:#c9ded7}.choice{padding-top:9px;border-top:1px solid #19393a}.choice strong{display:block;color:#e7f8ef;font-size:.9rem}.choice p{margin:3px 0 9px;color:#809f98;font-size:.76rem}.choice-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice-actions.one{grid-template-columns:1fr}.choice-actions button{min-height:42px;border-radius:12px;border:1px solid #315652;background:#143532;font-size:.8rem}.choice-actions button.emphasis{background:#1e5d48;border-color:#5d9f7e;color:#eefff4;font-weight:750}
.utility{margin-top:24px;border-top:1px solid #173236;padding-top:12px}.utility summary{color:#627f7a;font-size:.76rem;cursor:pointer}.utility-body{padding:10px 0;color:#7f9b96;font-size:.76rem}.utility a{color:#92b5ad}.utility button{color:#d5aaa8;text-decoration:underline;margin-top:9px}.history{padding-left:18px;max-height:180px;overflow:auto}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(min-width:431px){body{padding:18px 0}.phone{min-height:calc(100dvh - 36px);border:1px solid #17383b;border-radius:28px;box-shadow:0 24px 80px #000a}}
</style>
</head>
<body><main class="phone">
<header class="top"><div class="topline"><div><span class="wordmark">FIRST LIGHT</span><div id="phase">Origins</div></div><div id="progress-count" class="count">6 / 58</div></div><div class="track"><i id="progress-fill"></i></div></header>
<section class="mixer" aria-live="polite"><div class="slots"><button id="slot-a" class="slot" type="button"><span>A</span><strong>Choose</strong></button><div class="plus">+</div><button id="slot-b" class="slot" type="button"><span>B</span><strong>Choose</strong></button></div><div class="mixer-actions"><button id="combine" class="combine" type="button" disabled>Combine</button><button id="clear" class="clear" type="button" aria-label="Clear experiment">×</button></div><p id="status" class="status" role="status">Tap two concepts below.</p><div id="branchbar" class="branchbar" hidden><strong id="branch-label"></strong><button id="return-path" type="button">Return to path</button></div></section>
<section id="discovery" class="reveal" hidden><small>discovered</small><strong id="discovery-name"></strong><div id="discovery-meta" class="new-meta"></div><button id="use-discovery" type="button">Use this next →</button></section>
<section class="layer" id="world"><div class="layer-head"><div><h2>World</h2><p id="world-subtitle" class="subtle">Primordial</p></div></div><input id="search" class="search" placeholder="Find a concept" autocomplete="off" hidden><div id="tabs" class="tabs" aria-label="Discovered categories"></div><div id="concept-grid" class="grid"></div></section>
<section class="layer" id="memory" hidden><div class="layer-head"><div><h2>Memory</h2><p class="subtle">Relationships you have witnessed</p></div><span id="memory-count" class="subtle"></span></div><div id="memory-list" class="memory-list"></div><div id="memory-more" class="memory-more"></div></section>
<section class="layer" id="pattern" hidden><div class="layer-head"><div><h2>Connection</h2><p class="subtle">A reusable path has emerged</p></div></div><div id="pattern-card"></div></section>
<section class="layer" id="structures" hidden><div class="layer-head"><div><h2>Structures</h2><p class="subtle">Known relationships made operable</p></div></div><div id="structure-list"></div></section>
<details class="utility"><summary>Lab controls</summary><div class="utility-body"><div id="metrics"></div><ol id="history" class="history"></ol><a href="../">Open original First Light</a><br><button id="reset" type="button">Reset this world</button></div></details>
</main><script type="module" src="./app.mjs"></script></body></html>
